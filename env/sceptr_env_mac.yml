# sceptr_env (macOS, Apple silicon): SCEPTR TCR embeddings + FAISS k-means + the project pipeline.
# CPU/MPS build. Python 3.10.  Create:  mamba env create -f env/sceptr_env_mac.yml
# Full export (exact versions, no build strings) of the environment tested on 2026-10-14; the conda-forge
# packages share one OpenMP runtime, so PyTorch, XGBoost and FAISS can run in the same process.
# sceptr, libtcrlm, tidytcells and blosum come from PyPI (pip section at the end).
